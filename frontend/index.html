    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="description" content="V Foods — Pre-order food, skip canteen queues, and collect in seconds. Campus smart dining." />
    <meta property="og:title" content="V Foods — Campus Food Pre-Ordering" />
    <meta property="og:description" content="Pre-order food, skip canteen queues, and collect in seconds. Built for campus dining." />

    <title>V Foods — Campus Smart Dining &amp; Food Ordering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="initial-splash-loader" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background-color:#0B192C;color:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="width:44px;height:44px;border:3px solid #1E293B;border-top:3px solid #2563EB;border-radius:50%;animation:vfoods-spin 0.8s linear infinite;margin-bottom:16px;"></div>
        <div style="font-size:18px;font-weight:700;letter-spacing:0.5px;color:#F8FAFC;">V Foods</div>
        <div style="font-size:13px;color:#94A3B8;margin-top:4px;">Loading Campus Dining...</div>
        <style>
          @keyframes vfoods-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.startsWith('192.168.');
        if (isLocal) {
          // In local dev, unregister service workers to avoid stale bundle caching
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }
      }
    </script>
  </body>
</html>
