# ═══════════════════════════════════════════════════════════════════════════════
# CampusBite (V-BUY) — Render.com Unified Full-Stack Blueprint
# Deploys both:
# 1. FastAPI Python Backend Web Service
# 2. Vite React PWA Frontend Static Site (with SPA routing)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── 1. Backend API (FastAPI + Supabase + PhonePe + QR Engine) ───────────────
  - type: web
    name: campusbite-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: QR_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: campusbite-web
          type: web
          property: host
      - key: PHONEPE_MERCHANT_ID
        sync: false
      - key: PHONEPE_SALT_KEY
        sync: false
      - key: PHONEPE_SALT_INDEX
        value: "1"
      - key: PHONEPE_ENV
        value: SANDBOX
      - key: PHONEPE_BASE_URL
        value: https://api-preprod.phonepe.com/apis/pg-sandbox
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_WHATSAPP_INTEGRATED_NUMBER
        sync: false

  # ── 2. Frontend Web App & PWA (Vite + React 19 + PWA Service Worker) ────────
  - type: web
    name: campusbite-web
    runtime: static
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA rewrite rule — routes all client paths to index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Content-Type
        value: application/manifest+json
    envVars:
      - key: VITE_API_URL
        fromService:
          name: campusbite-api
          type: web
          property: host
      - key: VITE_SUPABASE_URL
        value: https://wahftohnwfoepuszvzrx.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_sFtEv2kLNn0vcmFNGzsEYg_Vx2yjHd5
